# /etc/nginx/sites-available/senja
#
# Install this as the plain-HTTP server block, then run:
#   sudo certbot --nginx -d testimonials.example.com
# Certbot rewrites this file in place to add the TLS block and the HTTP redirect.

server {
    listen 80;
    listen [::]:80;
    server_name testimonials.example.com;

    # Must be larger than MAX_UPLOAD_BYTES (8 MB default) or nginx rejects
    # the upload with a 413 before the app ever sees it.
    client_max_body_size 10M;

    # Avatars are content-addressed by UUID, so they can be cached hard.
    location /uploads/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
