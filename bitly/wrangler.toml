#:schema node_modules/wrangler/config-schema.json
name = "golinks"
main = "src/index.js"
compatibility_date = "2026-08-01"

# Serve only on your own hostname. `custom_domain = true` makes wrangler create
# and manage the DNS record for you on the first deploy - see README.
routes = [
  { pattern = "go.mydomain.com", custom_domain = true }
]
workers_dev = false

# Plain configuration only. Secrets live in `wrangler secret`, never here:
#   npx wrangler secret put ADMIN_PASSWORD
[vars]
# The origin used when building short links and QR codes.
SHORT_DOMAIN = "go.mydomain.com"
# Where an expired, capped or disabled link sends people - and what the bare
# root of the domain redirects to.
FALLBACK_URL = "https://mydomain.com/"

# npx wrangler kv namespace create LINKS   -> paste the id below
[[kv_namespaces]]
binding = "LINKS"
id = "PASTE_KV_NAMESPACE_ID"

# npx wrangler d1 create golinks           -> paste the database_id below
[[d1_databases]]
binding = "DB"
database_name = "golinks"
database_id = "PASTE_D1_DATABASE_ID"

# Workers Logs is left off on purpose: nothing about your traffic is retained
# by the platform beyond what D1 holds. `npx wrangler tail` still streams live
# logs on demand.
[observability]
enabled = false
