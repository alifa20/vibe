# /etc/nginx/sites-available/linkinbio
#
# Get the certificate first:
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d links.example.com
# Certbot rewrites this file to add the listen 443 / ssl_certificate lines.

server {
    listen 80;
    listen [::]:80;
    server_name links.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name links.example.com;

    # ssl_certificate / ssl_certificate_key are filled in by certbot.

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/html text/plain image/svg+xml application/json;
    gzip_min_length 512;

    access_log /var/log/nginx/links.access.log;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The app already sets Cache-Control and Content-Security-Policy per
        # route. Do not add your own here or they will be sent twice.
        proxy_redirect off;
    }
}
