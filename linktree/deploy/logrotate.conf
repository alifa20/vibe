# /etc/logrotate.d/linkinbio
#
# The click log is append-only and never truncated by the app, so rotate it.
# copytruncate keeps the running server's open file descriptor valid, so there
# is no need to restart after a rotation.
#
# Rotated files stay on disk for a year. /stats only reads clicks.log, so move
# an archive back if you need to query an older window:
#   zcat /srv/linkinbio/data/clicks.log.3.gz >> /srv/linkinbio/data/clicks.log

/srv/linkinbio/data/clicks.log {
    monthly
    rotate 12
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
    create 0640 linkinbio linkinbio
}
